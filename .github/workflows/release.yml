name: Validate and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check:assets
      - run: npx --yes --package=@anthropic-ai/claude-code claude plugin validate .
      - run: npm test
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
      - run: npm run package:skill
      - uses: actions/upload-artifact@v7
        with:
          name: context-gallery
          path: dist/context-gallery.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: context-gallery
          path: dist
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -c "import json,os; assert os.environ['RELEASE_TAG']=='v'+json.load(open('.claude-plugin/plugin.json'))['version']"
      - name: Prepare draft release for Desktop acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/context-gallery.zip --verify-tag --draft --title "Claude Unwrapped $RELEASE_TAG" --notes-file .github/release-notes.md
